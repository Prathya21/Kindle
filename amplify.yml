
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@10 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm --filter @workspace/kindle-reader build
  artifacts:
    baseDirectory: artifacts/kindle-reader/dist/public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
